name: Windows history coherent snapshot QA
run-name: Same 79e0 executable — coherent UIA history sampling
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  same-executable:
    if: github.repository == 'yuxino/Mimi' && github.ref == 'refs/heads/test/ci-caption-browser-session'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify isolated hosted runner and source artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'Disposable hosted Windows runner required.' }
          $artifact = gh api repos/yuxino/Mimi/actions/artifacts/14705436905 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.name -cne 'windows-ui-test-executable' -or
              $artifact.workflow_run.id -ne 44898694618 -or
              $artifact.workflow_run.head_sha -cne '79e0c7ef0d2d1a6e58ae2b3658e2f56001e8bdfa' -or
              $artifact.digest -cne 'sha256:482d3d299a7cb0e51d94fc267738f62d59b0c3374be4851fab6359b88c9cfeab') { throw 'The original artifact identity changed.' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-ui-test-executable
          run-id: 44898694618
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-executable
      - name: Windows PowerShell parser and coherent-sampling contracts
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/qa/history-coherence-contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Coherent sampling contract failed.' }
      - name: Same-byte physical Chinese and German history
        shell: pwsh
        run: |
          $executable = Join-Path $env:RUNNER_TEMP 'original-executable/mimi.exe'
          $sha = (Get-FileHash -Algorithm SHA256 $executable).Hash
          if ($sha -cne '63B682A18AB7C616F089635239305F0DB13E6DDAA5581D25BDDD3838D8894AD8') { throw 'The original executable bytes changed.' }
          $evidence = Join-Path $env:RUNNER_TEMP 'caption-history'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          @{ source = '79e0c7ef0d2d1a6e58ae2b3658e2f56001e8bdfa'; sourceRun = 44898694618; artifact = 14705436905; executableSha256 = $sha } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $evidence 'executable-identity.json')
          ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath $executable -ExpectedArchitecture x64 -OverlayInteraction caption-history -EvidenceDirectory $evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-history-coherence-79e0
          path: ${{ runner.temp }}/caption-history
          if-no-files-found: ignore
          retention-days: 3
