name: Windows blank panel drag QA
run-name: One native middle visual blank drag — verified 9ee0 Portable
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  panel-blank:
    if: github.repository == 'yuxino/Mimi' && github.ref == 'refs/heads/test/ci-caption-browser-session'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify isolated hosted runner and original Portable artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'Disposable hosted Windows runner required.' }
          $artifact = gh api repos/yuxino/Mimi/actions/artifacts/14707985546 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.name -cne 'mimi-windows-2025' -or
              $artifact.workflow_run.id -ne 44904152782 -or
              $artifact.workflow_run.head_sha -cne '9ee07ad09f21fa7e3d7de794c2b5ceb317a7eb1f' -or
              $artifact.digest -cne 'sha256:04c8c0b0509d0772e8004cc5fda56bb82a82af309f4f5943716d7ad49efc33f5') { throw 'Original artifact identity changed.' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mimi-windows-2025
          run-id: 44904152782
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-package
      - name: Prepare existing locale generator dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse helper with Windows PowerShell before native input
        shell: pwsh
        run: |
          $source = @'
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts/windows/tests/panel-blank-drag.ps1','scripts/windows/windows-overlay-interaction-smoke.ps1','scripts/windows/tests/localized-overlay-sessions.ps1')) {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          Write-Host 'Windows PowerShell 5.1 helper parsing passed.'
          '@
          $parse = Join-Path $env:RUNNER_TEMP 'parse-panel-blank.ps1'
          $source | Set-Content -LiteralPath $parse -Encoding utf8NoBOM
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $parse
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell parser failed.' }
      - name: One physical blank drag and original language selection
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'original-package') -Recurse -File -Filter '*_x64-portable.zip')
          if ($archives.Count -ne 1) { throw 'Exactly one original Portable archive required.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archives[0].FullName)
          try {
            $names = @($zip.Entries.FullName | Sort-Object)
            if ($names.Count -ne 2 -or (Compare-Object $names @('mimi.exe','mimi.portable'))) { throw 'Unexpected Portable archive entries.' }
          } finally { $zip.Dispose() }
          $extracted = Join-Path $env:RUNNER_TEMP 'panel-blank-portable'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extracted
          $executable = Join-Path $extracted 'mimi.exe'
          $sha = (Get-FileHash -Algorithm SHA256 $executable).Hash
          if ($sha -cne '55A838A186BB5C66611704C0C615D6BFAD3CFF03AE249DB1D0404A218A30F8B5') { throw 'Original Portable executable bytes changed.' }
          $evidence = Join-Path $env:RUNNER_TEMP 'panel-blank-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          @{ source='9ee07ad09f21fa7e3d7de794c2b5ceb317a7eb1f'; sourceRun=44904152782; artifact=14707985546; executableSha256=$sha } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'executable-identity.json') -Encoding utf8NoBOM
          ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath $executable -ExpectedArchitecture x64 -OverlayInteraction panel-languages -EvidenceDirectory $evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-panel-blank-drag-9ee0
          path: ${{ runner.temp }}/panel-blank-evidence
          if-no-files-found: ignore
          retention-days: 3
