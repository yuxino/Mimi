name: Observe native scrollbar release under renderer scheduling
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Verify the recorded package and source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $artifact = gh api repos/yuxino/Mimi/actions/artifacts/14703231834 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.name -cne 'windows-ui-test-executable' -or $artifact.workflow_run.head_sha -cne '810e5a1582705da7467d300831368bde6720950f' -or $artifact.digest -cne 'sha256:7731c48358b89dde4905d0bd17d2118186238bea4b9265c7df40bf2dd1b15ffa') { throw 'Unexpected Windows package' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14703231834'
          run-id: 44892832960
          github-token: ${{ github.token }}
          path: src-tauri/target/release
          merge-multiple: true
      - name: Compare native release with and without a bounded renderer delay
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./src-tauri/target/release/mimi.exe).Path
          Write-Host "Executable SHA-256 $((Get-FileHash $exe).Hash)"
          $failed = @()
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $env:MIMI_QA_WEBVIEW_PORT = $listener.LocalEndpoint.Port.ToString()
          $listener.Stop()
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-address=127.0.0.1 --remote-debugging-port=$env:MIMI_QA_WEBVIEW_PORT"
          foreach ($gesture in @('observe', 'down', 'last-scroll')) {
            $env:MIMI_QA_SCHEDULE = $gesture
            Write-Host "Physical release $gesture"
            & pwsh -NoProfile -File ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath $exe -ExpectedArchitecture x64 -OverlayInteraction caption-history -EvidenceDirectory "$env:RUNNER_TEMP/compare-history/$gesture"
            if ($LASTEXITCODE -ne 0) { $failed += $gesture }
          }
          if ($failed.Count -gt 0) { throw "Failed releases: $($failed -join ', ')" }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release-scheduling
          path: ${{ runner.temp }}/compare-history
          retention-days: 7
          if-no-files-found: error
