name: Linux native resume readiness
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-comparison:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify production source
        run: |
          source=0419d3930008ac3974889da6c866fa144db828ac
          git fetch --no-tags origin "$source"
          git diff --exit-code "$source" HEAD -- src src-tauri shared config package.json package-lock.json
      - name: Set up isolated Linux desktop
        run: |
          ./scripts/linux-ci-deps.sh
          sudo apt-get install --no-install-recommends -y python3-venv python3-pyatspi at-spi2-core python3-pil tesseract-ocr tesseract-ocr-eng xcompmgr mesa-utils
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/mimi-asr-timing"
          "$RUNNER_TEMP/mimi-asr-timing/bin/python" -m pip install --disable-pip-version-check 'websockets==15.0.1'
          dpkg-query -W libwebkit2gtk-4.1-0 xcompmgr
      - name: Download the previously measured formal build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mimi-linux-pause-observer-binary
          run-id: 44009432936
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mimi-pause-binary
      - name: Verify the exact executable before starting it
        run: |
          executable="$RUNNER_TEMP/mimi-pause-binary/mimi"
          printf '%s  %s\n' 8150580733c087f9a8cd65d81d5c5f707de59bde78c99a12dafdf8e5ee6a5ddb "$executable" | sha256sum --check
          chmod u+x "$executable"
      - name: Compare immediate and delayed resume readiness with native pixels
        timeout-minutes: 5
        shell: bash
        run: |
          sudo unshare --net bash -c '
            set -e
            ip link set lo up
            exec sudo -u "$SUDO_USER" -- env -u WAYLAND_DISPLAY GDK_BACKEND=x11 XDG_SESSION_TYPE=x11 \
              NO_AT_BRIDGE=0 GTK_MODULES=atk-bridge LIBGL_ALWAYS_SOFTWARE=1 LC_ALL=C.UTF-8 \
              dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" timeout 180 bash -c '"'"'
                set -e
                glxinfo -B
                "$1" -B "$2" "$3" "$4"
              '"'"' midi-display "$@"
          ' mimi-isolated-timing "$RUNNER_TEMP/mimi-asr-timing/bin/python" \
            "$PWD/scripts/linux-visible-capture-probe.py" \
            "$RUNNER_TEMP/mimi-pause-binary/mimi" "$PWD/scripts/linux-visible-capture-peer.py"
