name: Desktop subtitle acceptance
on:
  workflow_dispatch:
    inputs:
      revision: {description: Exact test revision, type: string, required: true}
      package: {description: Application to test, type: choice, options: [build, reuse, release], default: build}
      package_run: {description: Run that built the captured executable, type: string}
      release_tag: {description: Published Mac release tag, type: string, default: v1.7.4}
      checks: {description: Native interactions, type: choice, options: [both, history, panels, mac-input-capability, mac-caption-drag, mac-appkit-control, mac-dev-drag], default: both}
      gesture: {description: macOS drag starting surface, type: choice, options: [caption, panel], default: caption}
permissions:
  contents: read
  actions: read
jobs:
  signed-candidate:
    if: ${{ inputs.checks == 'mac-dev-drag' }}
    runs-on: macos-15
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Preserve the test desktop's isolated development builder
        run: install -m 700 scripts/macos/calibration/hosted-build.sh "$RUNNER_TEMP/build-caption-fixture.sh"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: desktop-package
          save-if: 'false'
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target
      - name: Build and verify the development candidate
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.revision }}
        run: bash "$RUNNER_TEMP/build-caption-fixture.sh" --no-launch "$SOURCE_SHA"
      - name: Drag the selected subtitle surface there and back
        env:
          EXPECTED_CERT: ${{ steps.candidate.outputs.identity_sha1 }}
          MIMI_TEST_DRAG_GESTURE: ${{ inputs.gesture }}
        run: bash scripts/macos/tests/run-caption-drag.sh --dev "$EXPECTED_CERT" "$RUNNER_TEMP/caption-drag"
      - name: Save public test measurements and synthetic caption windows
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-caption-drag
          path: ${{ runner.temp }}/caption-drag
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove this runner's private test signing identity
        if: always()
        run: if [[ -f "$RUNNER_TEMP/build-caption-fixture.sh" ]]; then bash "$RUNNER_TEMP/build-caption-fixture.sh" --cleanup; fi
  appkit-calibration:
    if: ${{ inputs.checks == 'mac-appkit-control' }}
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Compare the same pointer input on a plain AppKit window
        run: bash scripts/macos/calibration/run.sh "$RUNNER_TEMP/appkit-drag-calibration"
      - name: Save coordinates from the isolated control window
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: appkit-drag-calibration
          path: ${{ runner.temp }}/appkit-drag-calibration/*.log
          retention-days: 7
  mac-input-capability:
    if: ${{ inputs.checks == 'mac-input-capability' }}
    runs-on: macos-15
    timeout-minutes: 6
    steps:
      - name: Check the isolated Mac desktop before sending pointer input
        shell: bash
        run: |
          swift - <<'SWIFT'
          import AppKit
          import ApplicationServices
          let foreground = CGSessionCopyCurrentDictionary() as? [String: Any]
          print("Mac desktop preflight: screens=\(NSScreen.screens.count) graphicalSession=\(foreground != nil) trustedAccessibility=\(AXIsProcessTrusted()) mayPostInput=\(CGPreflightPostEventAccess()) mayReadWindows=\(CGPreflightScreenCaptureAccess())")
          SWIFT
  review:
    if: ${{ !startsWith(inputs.checks, 'mac-') }}
    runs-on: windows-2025
    timeout-minutes: 22
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - if: ${{ inputs.package == 'build' }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - if: ${{ inputs.package == 'build' }}
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: desktop-package
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target
      - run: npm ci --prefer-offline --no-audit --no-fund
      - if: ${{ inputs.package == 'build' }}
        name: Build offline native fixture from the selected revision
        run: npm run tauri -- build --no-bundle --config src-tauri/config/ci.json -- --locked
      - if: ${{ inputs.package == 'build' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: caption-history-executable
          path: src-tauri/target/release/mimi.exe
          retention-days: 2
          if-no-files-found: error
      - if: ${{ inputs.package == 'reuse' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: caption-history-executable
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: src-tauri/target/release
      - if: ${{ inputs.package == 'release' }}
        name: Check the published v1.7.4 portable archive
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mimi_1.7.4_x64-portable.zip'
          Invoke-WebRequest 'https://github.com/yuxino/Mimi/releases/download/v1.7.4/mimi_1.7.4_x64-portable.zip' -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash -ine '132d9c633507cdc651b52e526cf6c9432fb6db102c5f8d528c03b46a8480cdd1') { throw 'Published archive checksum mismatch.' }
          Expand-Archive $zip -DestinationPath ./src-tauri/target/release
      - id: ready
        shell: pwsh
        run: |
          $exe = (Get-FileHash -Algorithm SHA256 ./src-tauri/target/release/mimi.exe).Hash
          Write-Output "Executable SHA-256: $exe"
      - if: ${{ steps.ready.outcome == 'success' && (inputs.checks == 'history' || inputs.checks == 'both') }}
        name: Read historical captions and return to live with a physical mouse
        shell: pwsh
        run: ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath ./src-tauri/target/release/mimi.exe -ExpectedArchitecture x64 -OverlayInteraction caption-history -EvidenceDirectory "$env:RUNNER_TEMP/caption-history"
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' && (inputs.checks == 'panels' || inputs.checks == 'both') }}
        name: Select languages with the keyboard in nine localized interfaces
        shell: pwsh
        run: ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath ./src-tauri/target/release/mimi.exe -ExpectedArchitecture x64 -OverlayInteraction panel-languages -EvidenceDirectory "$env:RUNNER_TEMP/panel-languages"
      - if: ${{ !cancelled() && (inputs.checks == 'history' || inputs.checks == 'both') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-caption-history
          path: ${{ runner.temp }}/caption-history
          if-no-files-found: ignore
          retention-days: 7
      - if: ${{ !cancelled() && (inputs.checks == 'panels' || inputs.checks == 'both') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-panel-languages
          path: ${{ runner.temp }}/panel-languages
          if-no-files-found: ignore
          retention-days: 7

  caption-drag:
    if: ${{ inputs.checks == 'mac-caption-drag' }}
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Install the signed public Apple Silicon app on the test desktop
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ ! -e /Applications/mimi.app ]]
          assets="$RUNNER_TEMP/mimi-release"
          mkdir "$assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets" --pattern mimi.app.tar.gz --pattern SHA256SUMS.txt
          cd "$assets"
          awk '$2 == "mimi.app.tar.gz" { print; count++ } END { if (count != 1) exit 1 }' SHA256SUMS.txt > updater.sha256
          shasum -a 256 --check updater.sha256
          shasum -a 256 mimi.app.tar.gz
          python3 "$GITHUB_WORKSPACE/scripts/macos/extract-macos-updater.py" mimi.app.tar.gz "$RUNNER_TEMP/mimi-extracted"
          app="$RUNNER_TEMP/mimi-extracted/mimi.app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "${TAG#v}" ]]
          ditto "$app" /Applications/mimi.app
      - name: Drag the selected subtitle surface in the signed Mimi overlay
        env:
          MIMI_TEST_DRAG_GESTURE: ${{ inputs.gesture }}
        run: bash scripts/macos/tests/run-caption-drag.sh "$RUNNER_TEMP/caption-drag"
      - name: Save the synthetic subtitle crops and measured window positions
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-caption-drag
          path: ${{ runner.temp }}/caption-drag
          if-no-files-found: ignore
          retention-days: 7
