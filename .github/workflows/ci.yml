name: Windows release panel review
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Source revision containing the panel check
        required: true
        type: string
permissions:
  contents: read
jobs:
  review:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'mimi_1.7.4_x64-portable.zip'
          Invoke-WebRequest 'https://github.com/yuxino/Mimi/releases/download/v1.7.4/mimi_1.7.4_x64-portable.zip' -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash -ine '132d9c633507cdc651b52e526cf6c9432fb6db102c5f8d528c03b46a8480cdd1') { throw 'Published archive checksum mismatch.' }
          $extracted = Join-Path $env:RUNNER_TEMP 'mimi-panel-release'
          Expand-Archive $zip -DestinationPath $extracted
          ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath (Join-Path $extracted 'mimi.exe') -ExpectedArchitecture x64 -OverlayInteraction panel-languages -PanelEvidenceDirectory "$env:RUNNER_TEMP/panel-languages"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-panel-languages
          path: |
            ${{ runner.temp }}/panel-languages/*.png
            ${{ runner.temp }}/panel-languages/*.json
          if-no-files-found: ignore
          retention-days: 7
