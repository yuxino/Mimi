name: Caption browser session QA
run-name: Chromium pipe original vs session bus — ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'yuxino/Mimi' && github.ref == 'refs/heads/test/ci-caption-browser-session'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Guard and installed tool metadata
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(lsb_release -rs)" = 22.04
          command -v google-chrome
          command -v xvfb-run
          command -v dbus-run-session
          printf 'MIMI_QA_CHROME_VERSION=%s\n' "$(google-chrome --version)" >> "$GITHUB_ENV"
          echo 'Source under test: 21bd148d253686de6013f761cc93d79e8a4afbf3'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Before frontend checks — fixed ABBA
        run: xvfb-run -a node scripts/qa/browser-session-probe.mjs --matrix before-tests ABBA "$RUNNER_TEMP/caption-browser-session"
      - name: Original shared provider-copy checks
        run: |
          python3 -B scripts/providers/sync-provider-copy.py --check
          python3 -B scripts/providers/sync-provider-copy-test.py
      - name: Original frontend lint
        run: npm run lint
      - name: Original frontend tests
        run: npm run test
      - name: After frontend checks — fixed BAAB
        run: xvfb-run -a node scripts/qa/browser-session-probe.mjs --matrix after-tests BAAB "$RUNNER_TEMP/caption-browser-session"
      - name: Verify fixed sample count (not product acceptance)
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          rows=[json.loads(x) for x in (Path(os.environ['RUNNER_TEMP'])/'caption-browser-session/samples.jsonl').read_text().splitlines()]
          assert len(rows)==8
          assert [x['arm'] for x in rows[:4]]==['original','dbus-session','dbus-session','original']
          assert [x['arm'] for x in rows[4:]]==['dbus-session','original','original','dbus-session']
          assert len({x['chromeCLI'] for x in rows})==1
          for stage in ['before-tests','after-tests']:
            for arm in ['original','dbus-session']:
              group=[x for x in rows if x['stage']==stage and x['arm']==arm]
              print(json.dumps({'stage':stage,'arm':arm,'ready':sum(x['outcome']=='ready' for x in group),'samples':len(group),'elapsedMs':[x['elapsedMs'] for x in group]}))
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: caption-browser-session-qa
          path: ${{ runner.temp }}/caption-browser-session
          if-no-files-found: error
          retention-days: 3
