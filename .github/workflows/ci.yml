name: Check a fast scrollbar release in the signed macOS app
on: workflow_dispatch
permissions:
  contents: read
jobs:
  public-v175:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the signed public Apple Silicon app on the test desktop
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.7.5
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ ! -e /Applications/mimi.app ]]
          assets="$RUNNER_TEMP/mimi-release"
          mkdir "$assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets" --pattern mimi.app.tar.gz --pattern SHA256SUMS.txt
          cd "$assets"
          awk '$2 == "mimi.app.tar.gz" { print; count++ } END { if (count != 1) exit 1 }' SHA256SUMS.txt > updater.sha256
          shasum -a 256 --check updater.sha256
          shasum -a 256 mimi.app.tar.gz
          python3 "$GITHUB_WORKSPACE/scripts/macos/extract-macos-updater.py" mimi.app.tar.gz "$RUNNER_TEMP/mimi-extracted"
          app="$RUNNER_TEMP/mimi-extracted/mimi.app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "${TAG#v}" ]]
          ditto "$app" /Applications/mimi.app
      - name: Drag the painted thumb and release immediately at the bottom
        run: bash scripts/macos/calibration/history-thumb/run.sh "$RUNNER_TEMP/history-thumb"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-signed-history-fast-release
          path: ${{ runner.temp }}/history-thumb
          retention-days: 7
          if-no-files-found: ignore
