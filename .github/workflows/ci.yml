name: Windows Russian picker focus observation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-ui-test-executable
          run-id: 44898694618
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify the unchanged Windows candidate
        shell: pwsh
        run: |
          $sha = (Get-FileHash -Algorithm SHA256 ./candidate/mimi.exe).Hash
          if ($sha -cne '63B682A18AB7C616F089635239305F0DB13E6DDAA5581D25BDDD3838D8894AD8') { throw 'Candidate executable differs from original run.' }
          Write-Output "Unchanged candidate SHA-256: $sha (source=79e0c7ef, artifactRun=44898694618)."
      - name: Observe the original Russian keyboard path once
        shell: pwsh
        run: ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath ./candidate/mimi.exe -ExpectedArchitecture x64 -OverlayInteraction panel-languages -EvidenceDirectory "$env:RUNNER_TEMP/russian-focus"
      - name: Keep initial pictures and content-free focus and resize observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-russian-picker-focus
          path: ${{ runner.temp }}/russian-focus
          if-no-files-found: error
          retention-days: 7
