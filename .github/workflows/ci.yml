name: Desktop subtitle acceptance
on:
  workflow_dispatch:
    inputs:
      revision: {description: Exact test revision, type: string, required: true}
      package: {description: Application to test, type: choice, options: [build, reuse, release], default: build}
      package_run: {description: Run that produced the selected artifact, type: string}
      release_tag: {description: Expected Mac release tag, type: string, default: v1.7.4}
      checks: {description: Native interactions, type: choice, options: [both, history, panels, mac-input-capability, mac-caption-drag, mac-appkit-control, mac-dev-drag, mac-follow, mac-release-follow, mac-hover-video, linux-hover-input, mac-language, mac-direct-language, mac-recover-controls], default: both}
      display_modes: {description: Also cycle all three subtitle display modes in the running Mac app, type: boolean, default: false}
      language: {description: Language for the independent language-window check, type: choice, options: [en, zh], default: en}
      strict_hover: {description: Require the original quiet button target to accept its first click, type: boolean, default: false}
      gesture: {description: macOS drag starting surface, type: choice, options: [caption, panel], default: caption}
permissions:
  contents: read
  actions: read
jobs:
  linux-hover-input:
    if: ${{ inputs.checks == 'linux-hover-input' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: cp scripts/frontend/calibration/linux-hover-check.py "$RUNNER_TEMP/linux-hover-check.py"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a python3 "$RUNNER_TEMP/linux-hover-check.py"
  signed-candidate:
    if: ${{ inputs.checks == 'mac-dev-drag' || inputs.checks == 'mac-follow' || inputs.checks == 'mac-hover-video' || inputs.checks == 'mac-language' || inputs.checks == 'mac-direct-language' || inputs.checks == 'mac-recover-controls' }}
    runs-on: macos-15
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Preserve the test desktop's isolated development builder
        run: |
          install -m 700 scripts/macos/calibration/hosted-build.sh "$RUNNER_TEMP/build-caption-fixture.sh"
          if [[ -d scripts/macos/calibration/video ]]; then cp -R scripts/macos/calibration/video "$RUNNER_TEMP/video-tools"; fi
          if [[ -d scripts/macos/calibration/recover ]]; then cp -R scripts/macos/calibration/recover "$RUNNER_TEMP/recover-controls"; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: desktop-package
          save-if: 'false'
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target
      - name: Build and verify the development candidate
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.revision }}
        run: bash "$RUNNER_TEMP/build-caption-fixture.sh" --no-launch "$SOURCE_SHA"
      - name: Drag the selected subtitle surface there and back
        if: ${{ inputs.checks == 'mac-dev-drag' }}
        env:
          EXPECTED_CERT: ${{ steps.candidate.outputs.identity_sha1 }}
          MIMI_TEST_DRAG_GESTURE: ${{ inputs.gesture }}
        run: bash scripts/macos/tests/run-caption-drag.sh --dev "$EXPECTED_CERT" "$RUNNER_TEMP/caption-drag"
      - name: Save public test measurements and synthetic caption windows
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-caption-drag
          path: ${{ runner.temp }}/caption-drag
          if-no-files-found: ignore
          retention-days: 7
      - name: Recover locked controls with one physical click
        if: ${{ !cancelled() && inputs.checks == 'mac-recover-controls' && steps.candidate.outcome == 'success' }}
        env:
          EXPECTED_CERT: ${{ steps.candidate.outputs.identity_sha1 }}
        run: bash "$RUNNER_TEMP/recover-controls/run-recover-controls.sh" --dev "$EXPECTED_CERT" lock "$RUNNER_TEMP/recover-evidence/lock"
      - name: Keep blank panel clicks separate from More Settings
        if: ${{ !cancelled() && inputs.checks == 'mac-recover-controls' && steps.candidate.outcome == 'success' }}
        env:
          EXPECTED_CERT: ${{ steps.candidate.outputs.identity_sha1 }}
        run: bash "$RUNNER_TEMP/recover-controls/run-recover-controls.sh" --dev "$EXPECTED_CERT" settings "$RUNNER_TEMP/recover-evidence/settings"
      - name: Keep both recovery results and independent native window images
        if: ${{ !cancelled() && inputs.checks == 'mac-recover-controls' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-recover-controls
          path: ${{ runner.temp }}/recover-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Follow the same caption with animation off
        if: ${{ !cancelled() && inputs.checks == 'mac-follow' && steps.candidate.outcome == 'success' }}
        env:
          EXPECTED_CERT: ${{ steps.candidate.outputs.identity_sha1 }}
        run: bash scripts/macos/tests/run-translating-scroll.sh --dev "$EXPECTED_CERT" ${{ inputs.display_modes && '--display-modes' || '' }} "$RUNNER_TEMP/caption-follow/off"
      - name: Follow the same caption with animation on
        if: ${{ !cancelled() && inputs.checks == 'mac-follow' && steps.candidate.outcome == 'success' }}
        env:
          EXPECTED_CERT: ${{ steps.candidate.outputs.identity_sha1 }}
        run: bash scripts/macos/tests/run-translating-scroll.sh --dev "$EXPECTED_CERT" --animation ${{ inputs.display_modes && '--display-modes' || '' }} "$RUNNER_TEMP/caption-follow/on"
      - name: Read the hovered Chinese status and timing numbers on both native windows
        if: ${{ !cancelled() && inputs.checks == 'mac-follow' && steps.candidate.outcome == 'success' }}
        env:
          EXPECTED_CERT: ${{ steps.candidate.outputs.identity_sha1 }}
        run: bash scripts/macos/tests/run-translating-scroll.sh --dev "$EXPECTED_CERT" --status-readout "$RUNNER_TEMP/caption-follow/readout"
      - name: Save caption coordinates and synthetic window images
        if: ${{ !cancelled() && inputs.checks == 'mac-follow' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-caption-follow
          path: ${{ runner.temp }}/caption-follow
          if-no-files-found: ignore
          retention-days: 7
      - name: Check the language capsule and open its actual window
        if: ${{ inputs.checks == 'mac-language' && steps.candidate.outcome == 'success' }}
        env:
          EXPECTED_CERT: ${{ steps.candidate.outputs.identity_sha1 }}
          MIMI_CAPSULE_TEST_LANGUAGE: ${{ inputs.language }}
        run: bash "$RUNNER_TEMP/video-tools/run-hover-video.sh" --dev "$EXPECTED_CERT" language "$RUNNER_TEMP/language-proof"
      - name: Keep the independent child, physical input and menu observations
        if: ${{ !cancelled() && inputs.checks == 'mac-language' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-language-proof
          path: ${{ runner.temp }}/language-proof
          if-no-files-found: error
          retention-days: 7
      - name: Enter the quiet language island on four independent app launches
        if: ${{ inputs.checks == 'mac-direct-language' && steps.candidate.outcome == 'success' }}
        env:
          EXPECTED_CERT: ${{ steps.candidate.outputs.identity_sha1 }}
        run: |
          failed=0
          for entry in fast-first slow-first fast-return slow-return; do
            if ! MIMI_CAPSULE_ENTRY_PATH="$entry" MIMI_CAPSULE_TEST_LANGUAGE=en \
                 bash "$RUNNER_TEMP/video-tools/run-hover-video.sh" --dev "$EXPECTED_CERT" language "$RUNNER_TEMP/language-direct/$entry"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Keep every direct approach including first-click failures
        if: ${{ !cancelled() && inputs.checks == 'mac-direct-language' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-language-entry
          path: ${{ runner.temp }}/language-direct
          if-no-files-found: error
          retention-days: 7
      - name: Compile the window-only video recorder
        if: ${{ inputs.checks == 'mac-hover-video' && steps.candidate.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/video-tools/build-recorder.sh"
      - name: Record synthetic layout while moving the real pointer
        if: ${{ !cancelled() && inputs.checks == 'mac-hover-video' && steps.candidate.outcome == 'success' }}
        env:
          EXPECTED_CERT: ${{ steps.candidate.outputs.identity_sha1 }}
          STRICT: ${{ inputs.strict_hover }}
        run: |
          args=()
          if [[ "$STRICT" == true ]]; then args+=(--require-first-click); fi
          bash "$RUNNER_TEMP/video-tools/run-hover-video.sh" --dev "$EXPECTED_CERT" --animation ${args[@]+"${args[@]}"} layout "$RUNNER_TEMP/hover-video/layout"
      - name: Record synthetic history while moving the real pointer
        if: ${{ !cancelled() && inputs.checks == 'mac-hover-video' && steps.candidate.outcome == 'success' }}
        env:
          EXPECTED_CERT: ${{ steps.candidate.outputs.identity_sha1 }}
          STRICT: ${{ inputs.strict_hover }}
        run: |
          args=()
          if [[ "$STRICT" == true ]]; then args+=(--require-first-click); fi
          bash "$RUNNER_TEMP/video-tools/run-hover-video.sh" --dev "$EXPECTED_CERT" --animation ${args[@]+"${args[@]}"} history "$RUNNER_TEMP/hover-video/history"
      - name: Keep this test window's video, frame times, gestures and reference images
        if: ${{ !cancelled() && inputs.checks == 'mac-hover-video' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-hover-video
          path: ${{ runner.temp }}/hover-video
          if-no-files-found: error
          retention-days: 7
      - name: Remove this runner's private test signing identity
        if: always()
        run: if [[ -f "$RUNNER_TEMP/build-caption-fixture.sh" ]]; then bash "$RUNNER_TEMP/build-caption-fixture.sh" --cleanup; fi
  appkit-calibration:
    if: ${{ inputs.checks == 'mac-appkit-control' }}
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Compare the same pointer input on a plain AppKit window
        run: bash scripts/macos/calibration/run.sh "$RUNNER_TEMP/appkit-drag-calibration"
      - name: Save coordinates from the isolated control window
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: appkit-drag-calibration
          path: ${{ runner.temp }}/appkit-drag-calibration/*.log
          retention-days: 7
  mac-input-capability:
    if: ${{ inputs.checks == 'mac-input-capability' }}
    runs-on: macos-15
    timeout-minutes: 6
    steps:
      - name: Check the isolated Mac desktop before sending pointer input
        shell: bash
        run: |
          swift - <<'SWIFT'
          import AppKit
          import ApplicationServices
          let foreground = CGSessionCopyCurrentDictionary() as? [String: Any]
          print("Mac desktop preflight: screens=\(NSScreen.screens.count) graphicalSession=\(foreground != nil) trustedAccessibility=\(AXIsProcessTrusted()) mayPostInput=\(CGPreflightPostEventAccess()) mayReadWindows=\(CGPreflightScreenCaptureAccess())")
          SWIFT
  review:
    if: ${{ !startsWith(inputs.checks, 'mac-') }}
    runs-on: windows-2025
    timeout-minutes: 22
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - if: ${{ inputs.package == 'build' }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - if: ${{ inputs.package == 'build' }}
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: desktop-package
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target
      - run: npm ci --prefer-offline --no-audit --no-fund
      - if: ${{ inputs.package == 'build' }}
        name: Build offline native fixture from the selected revision
        run: npm run tauri -- build --no-bundle --config src-tauri/config/ci.json -- --locked
      - if: ${{ inputs.package == 'build' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: caption-history-executable
          path: src-tauri/target/release/mimi.exe
          retention-days: 2
          if-no-files-found: error
      - if: ${{ inputs.package == 'reuse' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: caption-history-executable
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: src-tauri/target/release
      - if: ${{ inputs.package == 'release' }}
        name: Check the published v1.7.4 portable archive
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mimi_1.7.4_x64-portable.zip'
          Invoke-WebRequest 'https://github.com/yuxino/Mimi/releases/download/v1.7.4/mimi_1.7.4_x64-portable.zip' -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash -ine '132d9c633507cdc651b52e526cf6c9432fb6db102c5f8d528c03b46a8480cdd1') { throw 'Published archive checksum mismatch.' }
          Expand-Archive $zip -DestinationPath ./src-tauri/target/release
      - id: ready
        shell: pwsh
        run: |
          $exe = (Get-FileHash -Algorithm SHA256 ./src-tauri/target/release/mimi.exe).Hash
          Write-Output "Executable SHA-256: $exe"
      - if: ${{ steps.ready.outcome == 'success' && (inputs.checks == 'history' || inputs.checks == 'both') }}
        name: Read historical captions and return to live with a physical mouse
        shell: pwsh
        run: ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath ./src-tauri/target/release/mimi.exe -ExpectedArchitecture x64 -OverlayInteraction caption-history -EvidenceDirectory "$env:RUNNER_TEMP/caption-history"
      - if: ${{ !cancelled() && steps.ready.outcome == 'success' && (inputs.checks == 'panels' || inputs.checks == 'both') }}
        name: Select languages with the keyboard in nine localized interfaces
        shell: pwsh
        run: ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath ./src-tauri/target/release/mimi.exe -ExpectedArchitecture x64 -OverlayInteraction panel-languages -EvidenceDirectory "$env:RUNNER_TEMP/panel-languages"
      - if: ${{ !cancelled() && (inputs.checks == 'history' || inputs.checks == 'both') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-caption-history
          path: ${{ runner.temp }}/caption-history
          if-no-files-found: ignore
          retention-days: 7
      - if: ${{ !cancelled() && (inputs.checks == 'panels' || inputs.checks == 'both') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-panel-languages
          path: ${{ runner.temp }}/panel-languages
          if-no-files-found: ignore
          retention-days: 7

  caption-drag:
    if: ${{ inputs.checks == 'mac-caption-drag' }}
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Install the signed public Apple Silicon app on the test desktop
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ ! -e /Applications/mimi.app ]]
          assets="$RUNNER_TEMP/mimi-release"
          mkdir "$assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets" --pattern mimi.app.tar.gz --pattern SHA256SUMS.txt
          cd "$assets"
          awk '$2 == "mimi.app.tar.gz" { print; count++ } END { if (count != 1) exit 1 }' SHA256SUMS.txt > updater.sha256
          shasum -a 256 --check updater.sha256
          shasum -a 256 mimi.app.tar.gz
          python3 "$GITHUB_WORKSPACE/scripts/macos/extract-macos-updater.py" mimi.app.tar.gz "$RUNNER_TEMP/mimi-extracted"
          app="$RUNNER_TEMP/mimi-extracted/mimi.app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "${TAG#v}" ]]
          ditto "$app" /Applications/mimi.app
      - name: Drag the selected subtitle surface in the signed Mimi overlay
        env:
          MIMI_TEST_DRAG_GESTURE: ${{ inputs.gesture }}
        run: bash scripts/macos/tests/run-caption-drag.sh "$RUNNER_TEMP/caption-drag"
      - name: Save the synthetic subtitle crops and measured window positions
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-caption-drag
          path: ${{ runner.temp }}/caption-drag
          if-no-files-found: ignore
          retention-days: 7

  mac-release-follow:
    if: ${{ inputs.checks == 'mac-release-follow' }}
    runs-on: macos-15
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Verify the exact formal tag run and ARM64 artifact provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.package_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$(uname -m)" == arm64 ]]
          [[ "$RELEASE_RUN" =~ ^[1-9][0-9]*$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" && ! -e /Applications/mimi.app ]]
          if pgrep -x mimi >/dev/null; then echo 'The hosted test desktop is already in use.' >&2; exit 1; fi
          read -r object_type object_sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object | [.type, .sha] | @tsv')
          for depth in 1 2 3; do
            [[ "$object_type" == tag ]] || break
            read -r object_type object_sha < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object | [.type, .sha] | @tsv')
          done
          [[ "$object_type" == commit && "$object_sha" == "$SOURCE_SHA" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" > "$RUNNER_TEMP/formal-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/formal-jobs.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/formal-artifacts.json"
          mkdir -p "$RUNNER_TEMP/caption-release"
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root / 'formal-run.json').read_text())
          expected = int(os.environ['RELEASE_RUN'])
          sha, tag, repo = (os.environ[k] for k in ('SOURCE_SHA', 'RELEASE_TAG', 'GITHUB_REPOSITORY'))
          assert run['id'] == expected and run['event'] == 'push', 'Not the expected push run'
          assert run['name'] == 'ci' and run['path'] == '.github/workflows/ci.yml', 'Not formal CI'
          assert run['repository']['full_name'] == repo and run['head_repository']['full_name'] == repo, 'Wrong repository'
          assert run['head_sha'] == sha and run['head_branch'] == tag, 'Run does not match tag and source'
          assert run['status'] in ('in_progress', 'completed'), 'Run is not active/completed'
          assert run['status'] != 'completed' or run['conclusion'] == 'success', 'Completed tag CI failed'
          jobs = [j for page in json.loads((root / 'formal-jobs.json').read_text()) for j in page['jobs']]
          jobs = [j for j in jobs if j['name'].startswith('release-macos (arm64,')]
          assert len(jobs) == 1 and jobs[0]['status'] == 'completed' and jobs[0]['conclusion'] == 'success', 'ARM64 release verification did not pass'
          artifacts = [a for page in json.loads((root / 'formal-artifacts.json').read_text()) for a in page['artifacts']]
          artifacts = [a for a in artifacts if a['name'] == 'mimi-release-macos-arm64']
          assert len(artifacts) == 1 and not artifacts[0]['expired'], 'Expected one unexpired ARM64 artifact'
          artifact = artifacts[0]
          assert artifact['workflow_run']['id'] == expected and artifact['workflow_run']['head_sha'] == sha, 'Artifact source differs'
          digest = artifact.get('digest') or ''
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest), 'Artifact SHA-256 digest unavailable'
          artifact_id = artifact['id']
          assert isinstance(artifact_id, int) and artifact_id > 0, 'Invalid artifact ID'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'artifact_id={artifact_id}\nartifact_sha256={digest[7:]}\n')
          evidence = dict(run=expected, runAttempt=run['run_attempt'], tag=tag, revision=sha,
                          releaseJob=jobs[0]['id'], artifact=artifact_id, artifactDigest=digest)
          (root / 'caption-release' / 'provenance.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence))
          PY
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Download, verify and install the unchanged signed archive
        id: install
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.provenance.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ steps.provenance.outputs.artifact_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/formal-macos-arm64"
          mkdir "$assets"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/formal-macos-arm64.zip"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$RUNNER_TEMP/formal-macos-arm64.zip" | shasum -a 256 --check
          python3 - <<'PY'
          import os, pathlib, shutil, stat, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          expected = {'mimi.app.tar.gz', 'mimi.app.tar.gz.sig', f"mimi_{os.environ['RELEASE_TAG'][1:]}_aarch64.dmg"}
          with zipfile.ZipFile(root / 'formal-macos-arm64.zip') as archive:
              files = archive.infolist()
              assert len(files) == len(expected) and {f.filename for f in files} == expected, 'Unexpected release artifact files'
              for info in files:
                  assert not info.is_dir() and not stat.S_ISLNK(info.external_attr >> 16), 'Unexpected artifact entry type'
                  with archive.open(info) as source, (root / 'formal-macos-arm64' / info.filename).open('xb') as target:
                      shutil.copyfileobj(source, target)
          PY
          public_key="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["plugins"]["updater"]["pubkey"])')"
          cargo run --release --locked --manifest-path scripts/updates/updater-signature-verifier/Cargo.toml -- \
            "$public_key" "$assets/mimi.app.tar.gz.sig" "$assets/mimi.app.tar.gz"
          python3 scripts/macos/extract-macos-updater.py "$assets/mimi.app.tar.gz" "$RUNNER_TEMP/formal-macos-extracted"
          app="$RUNNER_TEMP/formal-macos-extracted/mimi.app"
          certificate_prefix="$RUNNER_TEMP/mimi-follow-public-cert-"
          codesign --display --extract-certificates="$certificate_prefix" "$app"
          fingerprint="$(shasum -a 1 "${certificate_prefix}0" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          [[ "$fingerprint" == "$(tr -d '[:space:]' < scripts/macos/macos-release-identity.txt)" ]]
          # This is only the pinned PUBLIC certificate, as in formal tag CI.
          # No signing identity, private key, draft API or TCC grant is used.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "${certificate_prefix}0"
          touch "$RUNNER_TEMP/mimi-follow-public-cert-trusted"
          bash scripts/macos/verify-macos-release.sh "$app" "$assets/mimi_${RELEASE_TAG#v}_aarch64.dmg"
          bash scripts/macos/verify-macos-release-source.sh "$app" "$SOURCE_SHA" "${RELEASE_TAG#v}" arm64
          [[ ! -e /Applications/mimi.app ]]
          ditto "$app" /Applications/mimi.app
          bash scripts/macos/verify-macos-release-source.sh /Applications/mimi.app "$SOURCE_SHA" "${RELEASE_TAG#v}" arm64
          shasum -a 256 "$assets/mimi.app.tar.gz" /Applications/mimi.app/Contents/MacOS/mimi | tee "$RUNNER_TEMP/caption-release/verified-sha256.txt"
      - name: Replay the formal app with animation off
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/macos/tests/run-translating-scroll.sh ${{ inputs.display_modes && '--display-modes' || '' }} "$RUNNER_TEMP/caption-release/off"
      - name: Replay the formal app with animation on
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/macos/tests/run-translating-scroll.sh --animation ${{ inputs.display_modes && '--display-modes' || '' }} "$RUNNER_TEMP/caption-release/on"
      - name: Save formal artifact provenance and synthetic caption evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-release-caption-follow
          path: ${{ runner.temp }}/caption-release
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove runner-only public certificate trust
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/mimi-follow-public-cert-trusted" ]]; then
            sudo -n python3 - "$RUNNER_TEMP/mimi-follow-public-cert-0" <<'PY'
          import subprocess, sys
          try:
              subprocess.run(['/usr/bin/security', 'remove-trusted-cert', '-d', sys.argv[1]], check=False, timeout=15)
          except subprocess.TimeoutExpired:
              print('Public certificate trust cleanup timed out; the disposable VM will be discarded.')
          PY
          fi
