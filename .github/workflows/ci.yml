name: Windows blank panel drag QA
run-name: Native short-gesture focus trace — 42da7a53 quick gestures — three bounded native-only samples
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  panel-blank:
    if: github.repository == 'yuxino/Mimi' && github.ref == 'refs/heads/test/ci-caption-browser-session'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify isolated hosted runner and exact candidate executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'Disposable hosted Windows runner required.' }
          $artifact = gh api repos/yuxino/Mimi/actions/artifacts/14715014975 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.name -cne 'windows-ui-test-executable' -or
              $artifact.workflow_run.id -ne 44924800548 -or
              $artifact.workflow_run.head_sha -cne '42da7a53396b4f96a7f2dc7c953e4535721ad6d1' -or
              $artifact.digest -cne 'sha256:cfb1dd86673e47e7c5ca90fb1b09b4b0d03e8a8c07a424fb3822ad09dfe7d850') { throw 'Candidate artifact identity changed.' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-ui-test-executable
          run-id: 44924800548
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-executable
      - name: Prepare existing locale generator dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse helper with Windows PowerShell before native input
        shell: pwsh
        run: |
          $source = @'
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts/windows/tests/panel-drag-interaction.ps1','scripts/windows/tests/panel-drag-observation.ps1','scripts/windows/windows-overlay-interaction-smoke.ps1','scripts/windows/tests/localized-overlay-sessions.ps1')) {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          $frames=@([regex]::Matches("frame=1`n",'(?m)^frame=(\d+)\s*$'))
          if([int]$frames[-1].Groups[1].Value -ne 1){throw 'Encoder progress collection indexing failed.'}
          Add-Type -Path scripts/windows/tests/PanelDragObservation.cs
          Write-Host 'Windows PowerShell parsing and native observer compilation passed.'
          '@
          $parse = Join-Path $env:RUNNER_TEMP 'parse-panel-blank.ps1'
          $source | Set-Content -LiteralPath $parse -Encoding utf8NoBOM
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $parse
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell parser failed.' }
      - name: Exact long and short physical gestures with native trace
        shell: pwsh
        run: |
          $files=@(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'candidate-executable') -Recurse -File -Filter 'mimi.exe')
          if($files.Count -ne 1){throw 'Exactly one candidate executable required.'}
          $executable=$files[0].FullName
          $sha=(Get-FileHash -Algorithm SHA256 $executable).Hash
          if($sha -cne '990187FE925F8E8930872C14FDCE327DB33BB89D643EBCB5050D5A5263819243'){throw 'Exact candidate executable bytes changed.'}
          $failed=@()
          foreach($sample in @(1,2,3)) {
            $evidence=Join-Path $env:RUNNER_TEMP ('panel-short-evidence/sample-'+$sample)
            New-Item -ItemType Directory -Force -Path $evidence | Out-Null
            @{source='42da7a53396b4f96a7f2dc7c953e4535721ad6d1';sourceRun=44924800548;artifact=14715014975;executableSha256=$sha;sample=$sample;plannedSamples=3;video=$false} |
              ConvertTo-Json | Set-Content (Join-Path $evidence 'executable-identity.json') -Encoding utf8NoBOM
            & pwsh -NoProfile -File ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath $executable -ExpectedArchitecture x64 -OverlayInteraction panel-languages -EvidenceDirectory $evidence
            if($LASTEXITCODE -ne 0){$failed+=$sample}
          }
          if($failed.Count){throw "Native-only fixed samples failed: $($failed -join ','). All sample results retained; no retry to acceptance."}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-panel-short-focus
          path: ${{ runner.temp }}/panel-short-evidence
          if-no-files-found: ignore
          retention-days: 3
