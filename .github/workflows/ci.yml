name: Windows caption reading review
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact revision of the native mouse check
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mimi-windows-2025
          run-id: 44406242367
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-package
      - name: Scroll, wait for a caption, drag the thumb and read the next caption
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = @(Get-ChildItem "$env:RUNNER_TEMP/native-package" -Recurse -File -Filter '*x64-portable.zip')
          if ($archive.Count -ne 1) { throw 'Expected one x64 portable archive from the pinned source build.' }
          $dir = Join-Path $env:RUNNER_TEMP 'native-history-app'
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $dir
          $exe = Join-Path $dir 'mimi.exe'
          Write-Output "Executable SHA-256: $((Get-FileHash -Algorithm SHA256 $exe).Hash)"
          ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath $exe -ExpectedArchitecture x64 -OverlayInteraction caption-history -EvidenceDirectory "$env:RUNNER_TEMP/caption-history"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-caption-history
          path: ${{ runner.temp }}/caption-history
          if-no-files-found: ignore
          retention-days: 7
