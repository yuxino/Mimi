name: Linux production overlay comparison
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-comparison:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          cache: npm
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: desktop-package
          workspaces: |
            src-tauri
            shared/mimi-core -> ../target
            shared/mimi-android-jni -> ../target
          save-if: false
      - name: Verify both source revisions
        run: |
          baseline=9234cc824ba95ea89ea5862915514917fd052205
          candidate=f8d85b295b2c2a90cda46b1f4aafbdf4ca80f481
          git fetch --no-tags origin "$baseline" "$candidate"
          git diff --exit-code "$baseline" "$candidate^" -- src src-tauri shared config package.json package-lock.json scripts/build-linux-packages.sh
          git diff --exit-code "$candidate" HEAD -- src src-tauri shared config package.json package-lock.json
      - name: Set up isolated Linux desktop
        run: |
          ./scripts/linux-ci-deps.sh
          sudo apt-get install --no-install-recommends -y python3-venv python3-pyatspi at-spi2-core python3-pil tesseract-ocr tesseract-ocr-eng xcompmgr mesa-utils
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/mimi-asr-timing"
          "$RUNNER_TEMP/mimi-asr-timing/bin/python" -m pip install --disable-pip-version-check 'websockets==15.0.1'
          dpkg-query -W libwebkit2gtk-4.1-0 xcompmgr
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mimi-ubuntu-22.04
          run-id: 43918954832
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mimi-reference
      - name: Extract the exact packaged baseline
        shell: bash
        run: |
          mapfile -t packages < <(find "$RUNNER_TEMP/mimi-reference" -type f -name 'mimi_*_amd64.deb')
          [[ "${#packages[@]}" == 1 ]]
          [[ "$(dpkg-deb -f "${packages[0]}" Package)" == mimi ]]
          dpkg-deb -x "${packages[0]}" "$RUNNER_TEMP/baseline"
      - name: Build candidate with formal app identity and production frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run tauri -- build --no-bundle -- --locked
          sha256sum "$RUNNER_TEMP/baseline/usr/bin/mimi" "src-tauri/target/release/mimi"
      - name: Measure visible captions and verify interaction and pixels on X11
        timeout-minutes: 5
        shell: bash
        run: |
          sudo unshare --net bash -c '
            set -e
            ip link set lo up
            exec sudo -u "$SUDO_USER" -- env -u WAYLAND_DISPLAY GDK_BACKEND=x11 XDG_SESSION_TYPE=x11 \
              NO_AT_BRIDGE=0 GTK_MODULES=atk-bridge LIBGL_ALWAYS_SOFTWARE=1 LC_ALL=C.UTF-8 \
              dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" timeout 180 bash -c '"'"'
                set -e
                glxinfo -B
                "$1" -B "$2" "$3" "$4" "$5"
              '"'"' midi-display "$@"
          ' mimi-isolated-timing "$RUNNER_TEMP/mimi-asr-timing/bin/python" \
            "$PWD/scripts/linux-visible-capture-probe.py" "$RUNNER_TEMP/baseline/usr/bin/mimi" \
            "$PWD/src-tauri/target/release/mimi" "$PWD/scripts/linux-visible-capture-peer.py"
