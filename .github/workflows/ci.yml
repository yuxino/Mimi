name: Compare physical Windows scrollbar release timing
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify the recorded package and source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $artifact = gh api repos/yuxino/Mimi/actions/artifacts/14703231834 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.name -cne 'windows-ui-test-executable' -or $artifact.workflow_run.head_sha -cne '810e5a1582705da7467d300831368bde6720950f' -or $artifact.digest -cne 'sha256:7731c48358b89dde4905d0bd17d2118186238bea4b9265c7df40bf2dd1b15ffa') { throw 'Unexpected Windows package' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14703231834'
          run-id: 44892832960
          github-token: ${{ github.token }}
          path: src-tauri/target/release
          merge-multiple: true
      - name: Compare original, immediate and rested releases on the same executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./src-tauri/target/release/mimi.exe).Path
          Write-Host "Executable SHA-256 $((Get-FileHash $exe).Hash)"
          $failed = @()
          foreach ($gesture in @('original', 'immediate', 'rested')) {
            $env:MIMI_QA_THUMB_RELEASE = $gesture
            Write-Host "Physical release $gesture"
            & pwsh -NoProfile -File ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath $exe -ExpectedArchitecture x64 -OverlayInteraction caption-history -EvidenceDirectory "$env:RUNNER_TEMP/compare-history/$gesture"
            if ($LASTEXITCODE -ne 0) { $failed += $gesture }
          }
          if ($failed.Count -gt 0) { throw "Failed releases: $($failed -join ', ')" }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release-comparison
          path: ${{ runner.temp }}/compare-history
          retention-days: 7
          if-no-files-found: error
