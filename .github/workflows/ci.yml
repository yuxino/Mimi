name: Windows capsule calibration observation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-ui-test-executable
          run-id: 44897522655
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify the unchanged Windows candidate
        shell: pwsh
        run: |
          $sha = (Get-FileHash -Algorithm SHA256 ./candidate/mimi.exe).Hash
          if ($sha -cne '21D85A11E3BBA8B37B3119432F7668E0EDACC5214CDED412B36738C844E5771D') { throw 'Candidate executable differs from original run.' }
          Write-Output "Unchanged candidate SHA-256: $sha (source=21bd148d, artifactRun=44897522655)."
      - name: Observe the original physical pointer acceptance once
        shell: pwsh
        run: ./scripts/windows/windows-ci-smoke.ps1 -ExecutablePath ./candidate/mimi.exe -ExpectedArchitecture x64 -OverlayInteraction pointer -VerifyBothDragModes -EvidenceDirectory "$env:RUNNER_TEMP/capsule-calibration"
      - name: Keep the original pixel references and final native geometry
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-capsule-calibration
          path: ${{ runner.temp }}/capsule-calibration
          if-no-files-found: error
          retention-days: 7
