[package]
name = "mimi-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "One shared provider and translation runtime for Mimi desktop and Android"
license = "MIT"

[features]
default = []
apple-native = []
development-debugger = []
test-support = ["development-debugger"]

[dependencies]
mimi-core = { path = "../mimi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots", "url"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "system-proxy", "socks"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy-system"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
url = "2"
time = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"
