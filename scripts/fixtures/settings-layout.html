<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mimi settings layout fixture</title></head>
<body><main id="root"></main><script type="module">
// Local UI fixtures only: no native bridge, credentials, provider or capture.
let fixture = {};
window.__TAURI_INTERNALS__ = {
  metadata: { currentWindow: { label: "settings" }, currentWebview: { label: "settings" } },
  transformCallback: () => 0,
  unregisterCallback: () => {},
  invoke: async (command, args) => {
    if (command === "get_apple_speech_support") return fixture.appleSupport ?? { available: false, languages: [] };
    if (command === "windows_audio_status") {
      if (fixture.platform !== "windows") return null;
      if (fixture.state === "failed") throw new Error("fixture_unavailable");
      return {
        devices: fixture.state === "empty" ? [] : [{ id: "fixture-output", name: fixture.deviceName }],
        currentDevice: "fixture-output",
        receivingSound: fixture.state === "receiving",
        receivingAudioData: fixture.state === "silent" || fixture.state === "receiving",
      };
    }
    if (command === "app_desktop_shortcut_commands") return null;
    if (command === "profile_update") {
      if (fixture.nameSaveDelay) await new Promise(resolve => setTimeout(resolve, fixture.nameSaveDelay));
      if (fixture.failNameSave) throw new Error("fixture_name_save_failed");
      const current = useStore.getState().settings;
      const snapshot = { ...current, profiles: current.profiles.map(profile => {
        if (profile.id !== args.profileId) return profile;
        const next = { ...profile, ...(args.name === undefined ? {} : { name: args.name.trim() }) };
        if (args.textTranslationName) {
          next.textTranslationNames = { ...profile.textTranslationNames };
          const { route, name } = args.textTranslationName;
          if (name.trim()) next.textTranslationNames[route] = name.trim();
          else delete next.textTranslationNames[route];
        }
        if (args.speechRecognitionName !== undefined) {
          next.speechRecognitionName = args.speechRecognitionName.trim() || undefined;
        }
        return next;
      }) };
      // Stand in for the native settings event; this fixture never writes disk.
      useStore.setState({ settings: snapshot });
      return snapshot;
    }
    if (command === "profile_credential_editor_state") return args.textTranslation
      ? { savedFields: fixture.keyless ? [] : ["token"], endpoint: "http://127.0.0.1:8080/v1", model: "fixture-model" }
      : { savedFields: ["apiKey"], endpoint: "wss://speech.example/v1/realtime", model: "fixture-speech-model" };
    if (command === "profile_reveal_credential") return "fixture-saved-value";
    if (command === "plugin:event|listen") return 0;
    if (command === "plugin:event|unlisten") return;
    throw new Error("fixture_command_unavailable");
  },
};
const React = (await import("react")).default;
const { createRoot } = (await import("react-dom/client")).default;
const { flushSync } = (await import("react-dom")).default;
const { useStore } = await import("/src/lib/store.ts");
const { setStoredUiLanguage } = await import("/src/lib/i18n.ts");
const { SettingsView } = await import("/src/windows/settings/SettingsView.tsx");
await import("/src/index.css");
await import("/src/linux.css");
const initial = useStore.getState();
const root = createRoot(document.getElementById("root"));
const settle = () => new Promise(resolve => setTimeout(resolve, 0));
let generation = 0;
window.applyLayoutCase = async next => {
  fixture = next;
  Object.defineProperty(navigator, "userAgent", { configurable: true, value: next.platform === "windows" ? "Windows NT 10.0" : next.platform === "macos" ? "Macintosh" : "Linux x86_64" });
  const active = ["receiving", "silent", "noData"].includes(next.state);
  document.documentElement.dataset.platform = next.platform;
  document.documentElement.lang = next.language === "zh" ? "zh-CN" : next.language;
  location.hash = next.category ?? "service-profiles";
  localStorage.setItem("mimi.settings-theme", next.theme);
  setStoredUiLanguage(next.language);
  const appleProfile = next.editor && next.provider === "appleSpeech";
  const sourceLanguage = next.sourceLanguage ?? (appleProfile ? "en" : initial.settings.sourceLanguage);
  const targetLanguage = next.targetLanguage ?? (appleProfile ? "original" : initial.settings.targetLanguage);
  const profile = { id: next.profileId ?? "layout-custom", name: next.profileName ?? "Fixture configuration", provider: next.provider ?? "customDashScopeASR", credentialState: "present", speechCredentialState: "present", textCredentialState: "present", textTranslation: next.textTranslation ?? (appleProfile ? "followService" : "chatMock"), textTranslationNames: { chatMock: next.translationName ?? "" }, speechRecognitionName: next.speechRecognitionName, ...next.profileOverrides };
  useStore.setState({
    initializationStatus: "ready",
    settings: { ...initial.settings, uiLanguage: next.language, microphoneInputAvailable: next.platform === "macos", windowsAudioSource: next.state === "missing" ? "removed-output" : "fixture-output",
      sourceLanguage, targetLanguage,
      ...(next.editor ? { profiles: [profile], activeProfileId: profile.id } : {}),
      ...(appleProfile ? { languageCapabilities: { profileId: profile.id, provider: "appleSpeech", textTranslation: profile.textTranslation, targetLanguage,
        sourceLanguages: next.sourceLanguages ?? next.appleSupport?.languages.filter(language => language.installed).map(language => language.sourceLanguage) ?? [],
        targetLanguages: next.targetLanguages ?? ["original"], appleSpeechSupportRevision: 1 } } : {}),
    },
    session: { ...initial.session, isActive: active || next.state === "paused", isPaused: next.state === "paused", status: { kind: active ? "listening" : next.state === "paused" ? "paused" : "idle" } },
  });
  flushSync(() => root.render(React.createElement(SettingsView, { key: ++generation })));
  await settle();
  if (next.editor) {
    document.querySelector(".service-row__edit").click();
    await settle();
    if (next.reveal) {
      document.querySelector(".credential-panel__saved-actions button")?.click();
      await settle();
      for (const button of document.querySelectorAll(".saved-credential-input__toggle")) button.click();
      await settle();
    }
    if (next.appleExpanded) {
      document.querySelector(".apple-speech-tutorial-toggle")?.click();
      document.querySelector('.apple-speech-resource-actions button[aria-controls$="-apple-packs"]')?.click();
      await settle();
    }
  }
  if (next.providerPicker || next.providerConfirmation) {
    document.querySelector(".services-toolbar > button").click();
    await settle();
    if (next.providerConfirmation) {
      document.querySelector('.provider-option[data-provider="openAIRealtime"]').click();
      await settle();
    }
  }
};
await window.applyLayoutCase({ platform: "windows", language: "zh", state: "idle", theme: "light", deviceName: "Fixture headphones" });
window.layoutReady = true;
</script></body></html>
