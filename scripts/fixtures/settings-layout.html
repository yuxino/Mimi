const React = (await import("react")).default;

await import("/src/windows/tray-panel/tray-panel.css");

  const noop = async () => {};
  return React.createElement(OverlayControlPanel, {
    settings, model: overlayControlPanelModel(settings), status: languageStatus(settings, null),
    phase: "listening", isPaused: fixture.state === "paused", canPauseSession: false,

  Object.defineProperty(navigator, "userAgent", { configurable: true, value: next.platform === "windows" ? "Windows NT 10.0" : next.platform === "macos" ? "Macintosh" : "Linux x86_64" });
  const active = ["receiving", "silent", "noData"].includes(next.state);

  useStore.setState({

        targetLanguages: next.targetLanguages ?? (next.textTranslation === "apple" ? ["original", ...next.appleTranslationSupport?.targetLanguages ?? []] : ["original"]),
