<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:*; media-src 'none'; object-src 'none'">
  <title>Mimi README image</title>
  <style>
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
    .background { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    iframe { position: absolute; left: 64px; top: 428px; width: 760px; height: 300px;
      border: 0; transform: scale(1.28); transform-origin: top left; }
  </style>
</head>
<body>
  <img class="background" src="/docs/assets/readme-background.png" alt="">
  <iframe title="Mimi subtitle interface"></iframe>
  <script type="module">
    const locale = new URLSearchParams(location.search).get("locale");
    const frame = document.querySelector("iframe");
    frame.src = `./overlay.html?locale=${encodeURIComponent(locale)}`;
    window.readmeReady = (async () => {
      await Promise.all([document.querySelector("img").decode(),
        new Promise(resolve => frame.addEventListener("load", resolve, { once: true }))]);
      return await frame.contentWindow.readmeReady;
    })();
  </script>
</body>
</html>
